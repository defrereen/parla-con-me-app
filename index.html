<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; min-height: 100%; background: #fff; }
  body {
    height: 100%;
    min-height: 100%;
    font-family: 'Fredoka One', cursive;
    background: #fff;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  input {
    -webkit-user-select: text;
    user-select: text;
    font-size: 16px;
  }

  /* ── SCREENS ── */
  .screen { display: none; width: 100vw; height: 100dvh; min-height: 100dvh; }
  .screen.active { display: flex; }

  /* HOME */
  #screen-home {
    position: relative;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  #screen-home svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .home-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(255,209,93,0.15) 0%, rgba(255,150,50,0.25) 60%, rgba(0,0,0,0.08) 100%);
  }
  .home-card {
    position: relative; z-index: 10;
    background: rgba(255,255,255,0.93);
    border-radius: 32px;
    padding: 32px 32px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    width: min(92vw, 420px);
  }
  .home-card h1 { font-family: 'Fredoka One', cursive; font-size: clamp(36px,8vw,52px); color: #FF6B35; line-height: 1.1; }
  .home-card p { font-family: 'Nunito', sans-serif; font-size: 16px; font-weight: 700; color: #6b7280; }
  .home-card .emoji { font-size: 48px; }

  /* NOMI */
  #screen-nomi {
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    padding: max(24px, env(safe-area-inset-top)) 16px max(56px, env(safe-area-inset-bottom));
  }
  .nomi-inner { width: 100%; max-width: 520px; }
  .nomi-box {
    background: white;
    border-radius: 28px;
    padding: 32px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    margin-top: 0;
  }
  .nomi-box h2 { font-family: 'Fredoka One', cursive; font-size: 28px; color: #4F46E5; margin-bottom: 4px; text-align: center; }
  .nomi-box .sub { font-family: 'Nunito', sans-serif; font-size: 14px; color: #6b7280; text-align: center; font-weight: 600; margin-bottom: 20px; }
  .nome-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .nome-num {
    width: 30px; height: 30px; border-radius: 50%;
    background: #e5e7eb;
    display: flex; align-items: center; justify-content: center;
    color: white; font-family: 'Fredoka One', cursive; font-size: 14px;
    flex-shrink: 0; transition: background 0.3s;
  }
  .nome-input {
    border: 3px solid #e5e7eb; border-radius: 16px;
    padding: 12px 16px; font-size: 16px;
    font-family: 'Nunito', sans-serif; font-weight: 700;
    width: 100%; outline: none; background: #fafafa; color: #1f2937;
    transition: border-color 0.2s, background 0.2s;
    -webkit-appearance: none;
  }
  .nome-input:focus { border-color: #6366F1; background: white; }
  .nome-input::placeholder { color: #9ca3af; font-weight: 600; }
  .nomi-status { margin-top: 10px; text-align: center; font-size: 13px; color: #9ca3af; font-family: 'Nunito', sans-serif; font-weight: 600; }
  .nomi-status.ok { color: #10B981; }

  /* GIOCO */
  #screen-gioco {
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    transition: background 0.5s;
    overflow: hidden;
  }
  .gioco-header {
    position: absolute; top: max(20px, env(safe-area-inset-top));
    left: 20px; right: 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .pallini { display: flex; align-items: center; gap: 6px; }
  .pallino {
    width: 10px; height: 10px; border-radius: 50%;
    display: inline-block; transition: all 0.3s;
  }
  .gioco-center { display: flex; flex-direction: column; align-items: center; gap: 24px; width: 100%; max-width: 500px; }

  /* CARTE */
  .card-domanda {
    background: white;
    border-radius: 28px;
    padding: 36px 28px 28px;
    box-shadow: 0 8px 0 #d1d5db, 0 20px 50px rgba(0,0,0,0.12);
    width: 92%; max-width: 460px;
    position: relative; overflow: hidden;
  }
  .card-accent { position: absolute; top: 0; left: 0; right: 0; height: 8px; border-radius: 28px 28px 0 0; }
  .card-tag {
    display: inline-block; border-radius: 20px;
    padding: 5px 16px; font-size: 14px;
    font-family: 'Nunito', sans-serif; font-weight: 800;
    margin-bottom: 14px; color: white;
  }
  .card-testo {
    font-size: clamp(17px, 4vw, 22px);
    line-height: 1.6;
    font-family: 'Nunito', sans-serif; font-weight: 800; color: #1f2937;
  }
  .card-footer { margin-top: 20px; display: flex; align-items: center; gap: 8px; }
  .card-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .card-nome-small { font-size: 13px; color: #9ca3af; font-family: 'Nunito', sans-serif; font-weight: 600; }

  .card-gruppo {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 28px;
    padding: 32px 28px;
    box-shadow: 0 8px 0 #4c1d95, 0 20px 50px rgba(102,126,234,0.4);
    width: 92%; max-width: 460px;
    text-align: center;
  }
  .card-gruppo .emoji-big { font-size: 38px; margin-bottom: 12px; }
  .card-gruppo .badge {
    display: inline-block;
    background: rgba(255,255,255,0.2); border-radius: 14px;
    padding: 6px 18px; font-size: 12px;
    font-family: 'Nunito', sans-serif; font-weight: 800;
    letter-spacing: 1px; text-transform: uppercase; margin-bottom: 18px;
  }
  .card-gruppo .testo {
    font-size: clamp(17px, 4vw, 21px);
    line-height: 1.55; font-family: 'Nunito', sans-serif; font-weight: 800;
  }
  .card-gruppo .sub {
    margin-top: 18px;
    border-top: 2px solid rgba(255,255,255,0.2);
    padding-top: 14px; font-size: 13px; opacity: 0.8;
    font-family: 'Nunito', sans-serif; font-weight: 600;
  }

  .carta-counter {
    position: absolute;
    bottom: max(16px, env(safe-area-inset-bottom));
    font-size: 12px; font-family: 'Nunito', sans-serif; color: #9ca3af;
  }

  /* BOTTONI */
  .btn-main {
    background: #FF6B35; color: white;
    border: none; border-radius: 30px;
    padding: 16px 48px; font-size: 24px;
    font-family: 'Fredoka One', cursive;
    cursor: pointer;
    box-shadow: 0 6px 0 #c94e1e, 0 10px 25px rgba(255,107,53,0.4);
    transition: transform 0.12s, box-shadow 0.12s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-main:hover { transform: translateY(-2px); box-shadow: 0 8px 0 #c94e1e, 0 14px 30px rgba(255,107,53,0.4); }
  .btn-main:active { transform: translateY(3px); box-shadow: 0 3px 0 #c94e1e; }
  .btn-main:disabled { background: #aaa; box-shadow: 0 6px 0 #888; cursor: not-allowed; transform: none; }

  .btn-back {
    background: white; color: #374151;
    border: 2.5px solid #e5e7eb; border-radius: 20px;
    padding: 9px 20px; font-size: 15px;
    font-family: 'Nunito', sans-serif; font-weight: 700;
    cursor: pointer; transition: background 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-back:hover { background: #f3f4f6; }
  .btn-back.light { color: white; background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.4); }

  .btn-avanti {
    background: #10B981; color: white;
    border: none; border-radius: 24px;
    padding: 15px 40px; font-size: 20px;
    font-family: 'Fredoka One', cursive;
    cursor: pointer;
    box-shadow: 0 5px 0 #059669, 0 8px 20px rgba(16,185,129,0.35);
    transition: transform 0.12s, box-shadow 0.12s;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
    max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
  }
  .btn-avanti:hover { transform: translateY(-2px); }
  .btn-avanti:active { transform: translateY(3px); box-shadow: 0 2px 0 #059669; }

  /* ANIMAZIONE CARTA */
  @keyframes cardIn {
    0% { opacity: 0; transform: translateY(40px) rotate(-2deg) scale(0.92); }
    100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  }
  .card-anim { animation: cardIn 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards; }

  @media (max-height: 700px) {
    .card-domanda { padding: 28px 22px 20px; }
    .gioco-center { gap: 16px; }
    .card-gruppo { padding: 22px 22px; }
    .card-gruppo .emoji-big { font-size: 28px; margin-bottom: 8px; }
  }
</style>
</head>

// ══ DATI ══
const COLORI = ["#FF6B6B","#FFD166","#06D6A0","#118AB2","#EF4444","#8B5CF6","#F97316","#10B981","#3B82F6","#EC4899"];

const DOMANDE_PERSONALI = [
  "Qual è la cosa di cui vai più fiero nella tua vita fino ad ora?",
  "Se potessi cambiare una sola decisione del passato, quale sarebbe?",
  "Qual è la tua più grande paura che non ammetteresti mai ad alta voce?",

let mazzo = [];
let mazzoGruppo = [];

let cartaGruppoAttiva = false;
let nomiInputs = [];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ══ SCHERMATA ══
function mostra(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
  if (id === 'nomi') costruisciNomi();
}

// ══ NOMI ══
function costruisciNomi() {
  const lista = document.getElementById('nomi-lista');
  lista.innerHTML = '';
  nomiInputs = [];
  for (let i = 0; i < 9; i++) {
    const row = document.createElement('div');
    row.className = 'nome-row';
    const num = document.createElement('span');
    num.className = 'nome-num';
    num.id = 'num-' + i;
    num.textContent = i + 1;
    const inp = document.createElement('input');
    inp.className = 'nome-input';
    inp.placeholder = 'Giocatore ' + (i + 1);
    inp.maxLength = 20;
    inp.type = 'text';
    inp.autocomplete = 'off';
    inp.addEventListener('input', aggiornaNomi);
    nomiInputs.push(inp);
    row.appendChild(num);
    row.appendChild(inp);
    lista.appendChild(row);
  }
  aggiornaNomi();
}

function aggiornaNomi() {
  let validi = 0;
  nomiInputs.forEach((inp, i) => {
    const filled = inp.value.trim() !== '';
    if (filled) validi++;
    const num = document.getElementById('num-' + i);
    num.style.background = filled ? COLORI[i % COLORI.length] : '#e5e7eb';
  });
  const status = document.getElementById('nomi-status');
  const btn = document.getElementById('btn-inizia-gioco');
  if (validi < 2) {
    const mancano = 2 - validi;
    status.textContent = 'Aggiungi almeno ' + mancano + ' giocator' + (mancano > 1 ? 'i' : 'e') + ' per iniziare';
    status.className = 'nomi-status';
    btn.disabled = true;
  } else {
    status.textContent = validi + ' giocator' + (validi === 1 ? 'e' : 'i') + ' pronti! 🎉';
    status.className = 'nomi-status ok';
    btn.disabled = false;
  }
}

function avviaGioco() {
  giocatori = nomiInputs.map(i => i.value.trim()).filter(n => n !== '');
  mazzo = shuffle(TUTTE);
  mazzoGruppo = shuffle(DOMANDE_GRUPPO);
  turno = 0;
  indiceGlobale = 0;
  indiceGruppo = 0;
  cartaGruppoAttiva = false;
  mostra('gioco');
  renderGioco(true);
}

// ══ GIOCO ══
function renderGioco(animate) {
  const colore = COLORI[turno % COLORI.length];

  const schermo = document.getElementById('screen-gioco');
  if (cartaGruppoAttiva) {
    schermo.style.background = 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)';
  } else {
    schermo.style.background = `linear-gradient(135deg, ${colore}33 0%, ${colore}66 100%)`;
  }

  const btnBack = document.getElementById('btn-back-gioco');
  if (cartaGruppoAttiva) {
    btnBack.className = 'btn-back light';
  } else {
    btnBack.className = 'btn-back';
  }

  const pallini = document.getElementById('pallini-container');
  pallini.innerHTML = '';
  giocatori.forEach((_, i) => {
    const p = document.createElement('span');
    p.className = 'pallino';
    if (cartaGruppoAttiva) {
      p.style.background = 'rgba(255,255,255,0.35)';
      p.style.transform = 'scale(1)';
    } else {
      p.style.background = COLORI[i % COLORI.length];
      p.style.opacity = i === turno ? '1' : '0.3';
      p.style.transform = i === turno ? 'scale(1.5)' : 'scale(1)';
      if (i === turno) p.style.border = '2px solid white';
      else p.style.border = 'none';
    }
    pallini.appendChild(p);
  });

  const container = document.getElementById('carta-container');
  container.innerHTML = '';

  let carta;
  if (cartaGruppoAttiva) {
    const domanda = mazzoGruppo[indiceGruppo % mazzoGruppo.length];
    carta = document.createElement('div');
    carta.className = 'card-gruppo';
    carta.innerHTML = `
      <div class="emoji-big">⭐</div>
      <div class="badge">🌟 Carta per tutti 🌟</div>
      <p class="testo">${domanda}</p>
      <div class="sub">Rispondete tutti insieme!</div>
    `;
  } else {
    const domanda = mazzo[indiceGlobale % mazzo.length];
    carta = document.createElement('div');
    carta.className = 'card-domanda';
    carta.innerHTML = `
      <div class="card-accent" style="background:${colore}"></div>
      <span class="card-tag" style="background:${colore}">${giocatori[turno]}</span>
      <p class="card-testo">${domanda}</p>
      <div class="card-footer">
        <div class="card-dot" style="background:${colore}"></div>
        <span class="card-nome-small">Turno di ${giocatori[turno]}</span>
      </div>
    `;
  }

  if (animate) carta.classList.add('card-anim');
  container.appendChild(carta);

  const btnAvanti = document.getElementById('btn-avanti');
  if (cartaGruppoAttiva) {
    const prossimo = giocatori[(turno) % giocatori.length];
    btnAvanti.textContent = `Avanti → ${prossimo}`;
  } else if (turno === giocatori.length - 1) {
    btnAvanti.textContent = 'Avanti → Tutti! ⭐';
  } else {
    btnAvanti.textContent = `Avanti → ${giocatori[turno + 1]}`;
  }

  document.getElementById('carta-counter').textContent = 'Carta #' + (indiceGlobale + 1);
  document.getElementById('carta-counter').style.color = cartaGruppoAttiva ? 'rgba(255,255,255,0.35)' : '#9ca3af';
}

function avanti() {
  if (cartaGruppoAttiva) {
    cartaGruppoAttiva = false;
    indiceGruppo++;
    renderGioco(true);
  } else {
    const prossimo = (turno + 1) % giocatori.length;
    if (prossimo === 0) {
      turno = 0;
      indiceGlobale++;
      cartaGruppoAttiva = true;
    } else {
      turno = prossimo;
      indiceGlobale++;
    }
    renderGioco(true);
  }
}

costruisciNomi();
</script>
</body>
</html>
